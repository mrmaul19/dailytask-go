basePath: /
definitions:
  dto.AuthEnvelope:
    properties:
      data:
        $ref: '#/definitions/dto.AuthResponse'
      message:
        example: login berhasil
        type: string
      success:
        example: true
        type: boolean
    type: object
  dto.AuthResponse:
    properties:
      expires_at:
        description: |-
          ExpiresAt dikirim supaya client tahu kapan harus login lagi tanpa
          perlu membongkar isi token sendiri.
        type: string
      token:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.CreateGoalsRequest:
    properties:
      category:
        maxLength: 100
        type: string
      priority:
        maxLength: 100
        type: string
      progress:
        maxLength: 100
        type: string
      status:
        maxLength: 100
        type: string
      title:
        maxLength: 255
        minLength: 3
        type: string
    required:
    - category
    - priority
    - status
    - title
    type: object
  dto.CreateUserRequest:
    properties:
      address:
        maxLength: 255
        type: string
      email:
        maxLength: 255
        type: string
      job:
        maxLength: 100
        type: string
      name:
        maxLength: 100
        minLength: 3
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      role:
        description: |-
          Role opsional; kosong berarti "user". Dibatasi oneof supaya nilai asing
          ditolak sejak di pintu masuk, bukan baru ketahuan di CHECK constraint.
        enum:
        - user
        - admin
        type: string
      status:
        maxLength: 100
        type: string
    required:
    - address
    - email
    - job
    - name
    - password
    - status
    type: object
  dto.ErrorEnvelope:
    properties:
      errors:
        additionalProperties:
          type: string
        type: object
      message:
        example: data tidak valid
        type: string
      success:
        example: false
        type: boolean
    type: object
  dto.GoalsEnvelope:
    properties:
      data:
        $ref: '#/definitions/dto.GoalsResponse'
      message:
        example: detail goals berhasil diambil
        type: string
      success:
        example: true
        type: boolean
    type: object
  dto.GoalsListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.GoalsResponse'
        type: array
      message:
        example: daftar goals berhasil diambil
        type: string
      meta:
        $ref: '#/definitions/response.Meta'
      success:
        example: true
        type: boolean
    type: object
  dto.GoalsResponse:
    properties:
      category:
        type: string
      created_at:
        type: string
      id:
        type: integer
      priority:
        type: string
      progress:
        type: string
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  dto.HealthData:
    properties:
      status:
        example: ok
        type: string
    type: object
  dto.HealthEnvelope:
    properties:
      data:
        $ref: '#/definitions/dto.HealthData'
      message:
        example: service berjalan normal
        type: string
      success:
        example: true
        type: boolean
    type: object
  dto.LoginRequest:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 72
        type: string
    required:
    - email
    - password
    type: object
  dto.MessageEnvelope:
    properties:
      message:
        example: task berhasil dihapus
        type: string
      success:
        example: true
        type: boolean
    type: object
  dto.RegisterRequest:
    properties:
      address:
        maxLength: 255
        type: string
      email:
        maxLength: 255
        type: string
      job:
        maxLength: 100
        type: string
      name:
        maxLength: 100
        minLength: 3
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - address
    - email
    - job
    - name
    - password
    type: object
  dto.RunningTimeEntryEnvelope:
    properties:
      data:
        $ref: '#/definitions/dto.TimeEntryResponse'
      message:
        example: tidak ada timer yang sedang berjalan
        type: string
      success:
        example: true
        type: boolean
    type: object
  dto.StartTimerRequest:
    properties:
      note:
        maxLength: 255
        type: string
      task_id:
        minimum: 1
        type: integer
    required:
    - task_id
    type: object
  dto.StopTimerRequest:
    properties:
      note:
        maxLength: 255
        type: string
    type: object
  dto.TaskEnvelope:
    properties:
      data:
        $ref: '#/definitions/dto.TaskResponse'
      message:
        example: detail task berhasil diambil
        type: string
      success:
        example: true
        type: boolean
    type: object
  dto.TaskListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.TaskResponse'
        type: array
      message:
        example: daftar task berhasil diambil
        type: string
      meta:
        $ref: '#/definitions/response.Meta'
      success:
        example: true
        type: boolean
    type: object
  dto.TaskResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      file_name:
        type: string
      file_url:
        type: string
      id:
        type: integer
      judul:
        type: string
      no_task:
        type: string
      updated_at:
        type: string
    type: object
  dto.TimeEntryEnvelope:
    properties:
      data:
        $ref: '#/definitions/dto.TimeEntryResponse'
      message:
        example: timer berhasil dimulai
        type: string
      success:
        example: true
        type: boolean
    type: object
  dto.TimeEntryListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.TimeEntryResponse'
        type: array
      message:
        example: daftar catatan waktu berhasil diambil
        type: string
      meta:
        $ref: '#/definitions/response.Meta'
      success:
        example: true
        type: boolean
    type: object
  dto.TimeEntryResponse:
    properties:
      created_at:
        type: string
      duration_seconds:
        type: integer
      ended_at:
        type: string
      id:
        type: integer
      is_running:
        type: boolean
      note:
        type: string
      started_at:
        type: string
      task_id:
        type: integer
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  dto.UpdateGoalsRequest:
    properties:
      category:
        maxLength: 100
        type: string
      priority:
        maxLength: 100
        type: string
      progress:
        maxLength: 100
        type: string
      status:
        maxLength: 100
        type: string
      title:
        maxLength: 255
        minLength: 3
        type: string
    type: object
  dto.UpdateTimeEntryRequest:
    properties:
      ended_at:
        type: string
      note:
        maxLength: 255
        type: string
      started_at:
        type: string
      task_id:
        minimum: 1
        type: integer
    type: object
  dto.UpdateUserRequest:
    properties:
      address:
        maxLength: 255
        type: string
      email:
        maxLength: 255
        type: string
      job:
        maxLength: 100
        type: string
      name:
        maxLength: 100
        minLength: 3
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      role:
        enum:
        - user
        - admin
        type: string
      status:
        maxLength: 100
        type: string
    type: object
  dto.UserEnvelope:
    properties:
      data:
        $ref: '#/definitions/dto.UserResponse'
      message:
        example: detail user berhasil diambil
        type: string
      success:
        example: true
        type: boolean
    type: object
  dto.UserListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.UserResponse'
        type: array
      message:
        example: daftar user berhasil diambil
        type: string
      meta:
        $ref: '#/definitions/response.Meta'
      success:
        example: true
        type: boolean
    type: object
  dto.UserResponse:
    properties:
      address:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      job:
        type: string
      name:
        type: string
      role:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  response.Meta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
info:
  contact: {}
  description: |-
    REST API untuk mencatat daily task (dengan lampiran file), goals, dan users.
    Dibangun dengan Go Fiber + database/sql (driver pgx) + PostgreSQL, tanpa ORM,
    mengikuti Clean Architecture. Spec ini digenerate dari anotasi di handler
    oleh `swag init`, jadi ia selalu ikut kode — bukan dokumen terpisah yang gampang basi.
  title: Daily Task API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Mengembalikan token akses yang dipakai sebagai header `Authorization: Bearer {token}`.
        Email yang tidak terdaftar dan password yang salah dibalas 401 dengan pesan yang sama persis —
        disengaja, supaya endpoint ini tidak bisa dipakai memeriksa email mana saja yang punya akun.
      parameters:
      - description: Email dan password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuthEnvelope'
        "400":
          description: validasi gagal
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "401":
          description: email atau password salah
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "429":
          description: terlalu banyak percobaan
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
      summary: Login dan ambil token
      tags:
      - Auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: |-
        Endpoint publik untuk mendaftar sendiri. Langsung mengembalikan token,
        jadi client tidak perlu memanggil login lagi setelah berhasil daftar.
        Status akun ditentukan server (`aktif`) dan tidak bisa dikirim dari sini —
        gunakan `POST /api/v1/users` kalau ingin menentukannya sendiri.
      parameters:
      - description: Data pendaftaran
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.AuthEnvelope'
        "400":
          description: validasi gagal
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "409":
          description: email sudah terdaftar
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "429":
          description: terlalu banyak percobaan
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
      summary: Daftar akun baru
      tags:
      - Auth
  /api/v1/goals:
    get:
      description: '`search` dicocokkan ke `title` dan `category` (case-insensitive,
        pakai ILIKE).'
      parameters:
      - description: Kata kunci pencarian
        in: query
        name: search
        type: string
      - default: 1
        description: Halaman, mulai dari 1
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 10
        description: Jumlah data per halaman
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GoalsListEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
      summary: Daftar goals
      tags:
      - Goals
    post:
      consumes:
      - application/json
      description: Goals tidak punya lampiran file, jadi request dan response-nya
        JSON murni.
      parameters:
      - description: Data goals
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateGoalsRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.GoalsEnvelope'
        "400":
          description: validasi gagal
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
      summary: Buat goals baru
      tags:
      - Goals
  /api/v1/goals/{id}:
    delete:
      description: 'Soft delete: baris hanya diberi `deleted_at`, tidak benar-benar
        dihapus dari tabel.'
      parameters:
      - description: ID goals
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MessageEnvelope'
        "400":
          description: id bukan angka positif
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "404":
          description: goals tidak ditemukan
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
      summary: Hapus goals
      tags:
      - Goals
    get:
      description: Goals yang sudah dihapus (soft delete) tidak ikut terambil.
      parameters:
      - description: ID goals
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GoalsEnvelope'
        "400":
          description: id bukan angka positif
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "404":
          description: goals tidak ditemukan
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
      summary: Detail goals
      tags:
      - Goals
    put:
      consumes:
      - application/json
      description: |-
        Update sebagian field (partial update). Field yang tidak dikirim tetap memakai nilai lama,
        field yang dikirim kosong ditolak dengan 400.
      parameters:
      - description: ID goals
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: Field yang mau diubah saja
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateGoalsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GoalsEnvelope'
        "400":
          description: validasi gagal atau id tidak valid
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "404":
          description: goals tidak ditemukan
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
      summary: Perbarui goals
      tags:
      - Goals
  /api/v1/tasks:
    get:
      description: |-
        Mengambil daftar task dengan pencarian dan paginasi.
        `search` dicocokkan ke `no_task` dan `judul` (case-insensitive, pakai ILIKE).
      parameters:
      - description: Kata kunci pencarian
        in: query
        name: search
        type: string
      - default: 1
        description: Halaman, mulai dari 1
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 10
        description: Jumlah data per halaman
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TaskListEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
      summary: Daftar task
      tags:
      - Tasks
    post:
      consumes:
      - multipart/form-data
      - application/json
      description: |-
        Membuat task baru, dengan atau tanpa lampiran file.
        Kirim sebagai `multipart/form-data` kalau ada file, atau `application/json` kalau tanpa file.
        `no_task` boleh dikosongkan — server akan membuatnya dengan format `TASK-YYYYMMDD-XXXX`.
      parameters:
      - description: Nomor task, wajib unik. Digenerate otomatis kalau kosong
        in: formData
        maxLength: 50
        name: no_task
        type: string
      - description: Judul task
        in: formData
        maxLength: 255
        minLength: 3
        name: judul
        required: true
        type: string
      - description: Keterangan task
        in: formData
        maxLength: 2000
        name: description
        type: string
      - description: Lampiran. Ekstensi & ukuran dibatasi ALLOWED_EXT / MAX_UPLOAD_MB
        in: formData
        name: file
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.TaskEnvelope'
        "400":
          description: validasi gagal atau ekstensi/ukuran file ditolak
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "409":
          description: no_task sudah dipakai task lain
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
      summary: Buat task baru
      tags:
      - Tasks
  /api/v1/tasks/{id}:
    delete:
      description: 'Soft delete: baris hanya diberi `deleted_at`, tetapi lampiran
        di disk dihapus permanen.'
      parameters:
      - description: ID task
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MessageEnvelope'
        "400":
          description: id bukan angka positif
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "404":
          description: task tidak ditemukan
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
      summary: Hapus task
      tags:
      - Tasks
    get:
      description: Mengambil satu task berdasarkan id. Task yang sudah dihapus (soft
        delete) tidak ikut terambil.
      parameters:
      - description: ID task
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TaskEnvelope'
        "400":
          description: id bukan angka positif
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "404":
          description: task tidak ditemukan
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
      summary: Detail task
      tags:
      - Tasks
    put:
      consumes:
      - multipart/form-data
      - application/json
      description: |-
        Update sebagian field (partial update). Field yang tidak dikirim tetap memakai nilai lama,
        field yang dikirim kosong ditolak dengan 400.
        Mengirim `file` baru akan menghapus lampiran lama dari disk setelah DB sukses;
        `remove_file=true` melepas lampiran tanpa menggantinya.
      parameters:
      - description: ID task
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: Nomor task, wajib unik
        in: formData
        maxLength: 50
        name: no_task
        type: string
      - description: Judul task
        in: formData
        maxLength: 255
        minLength: 3
        name: judul
        type: string
      - description: Keterangan task
        in: formData
        maxLength: 2000
        name: description
        type: string
      - description: Lampiran pengganti
        in: formData
        name: file
        type: file
      - description: true untuk melepas lampiran yang ada
        in: formData
        name: remove_file
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TaskEnvelope'
        "400":
          description: validasi gagal, id tidak valid, atau file ditolak
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "404":
          description: task tidak ditemukan
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "409":
          description: no_task sudah dipakai task lain
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
      summary: Perbarui task
      tags:
      - Tasks
  /api/v1/tasks/{id}/download:
    get:
      description: |-
        Mengirim file lampiran sebagai stream. File tidak diserve lewat folder static:
        nama file di disk diacak dan path-nya dibaca dari DB, jadi URL-nya tidak bisa ditebak.
      parameters:
      - description: ID task
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/octet-stream
      responses:
        "200":
          description: isi file lampiran
          schema:
            type: file
        "400":
          description: id bukan angka positif
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "404":
          description: task tidak ditemukan atau tidak punya lampiran
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
      summary: Unduh lampiran task
      tags:
      - Tasks
  /api/v1/time-entries:
    get:
      description: |-
        Hanya catatan waktu milik pemanggil yang dikembalikan — `user_id` diambil dari
        token, bukan dari query string.
        `from` dan `to` memakai format RFC3339, contoh `2026-11-01T00:00:00+07:00`.
        Keduanya disaring pada `started_at`, dengan batas bawah inklusif dan batas atas
        eksklusif — jadi rentang satu bulan penuh ditulis dari tanggal 1 bulan ini
        sampai tanggal 1 bulan berikutnya.
      parameters:
      - description: Saring per task
        in: query
        minimum: 1
        name: task_id
        type: integer
      - description: Mulai dari (RFC3339)
        in: query
        name: from
        type: string
      - description: Sampai sebelum (RFC3339)
        in: query
        name: to
        type: string
      - default: 1
        description: Halaman, mulai dari 1
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 10
        description: Jumlah data per halaman
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TimeEntryListEnvelope'
        "400":
          description: format waktu atau rentang tidak valid
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "401":
          description: token tidak dikirim atau tidak valid
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Daftar catatan waktu
      tags:
      - Time Tracking
  /api/v1/time-entries/{id}:
    delete:
      description: |-
        Soft delete: baris hanya diberi `deleted_at`. Menghapus timer yang sedang
        berjalan membebaskan user untuk memulai timer baru.
      parameters:
      - description: ID catatan waktu
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MessageEnvelope'
        "400":
          description: id bukan angka positif
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "401":
          description: token tidak dikirim atau tidak valid
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "404":
          description: catatan waktu tidak ditemukan
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Hapus catatan waktu
      tags:
      - Time Tracking
    get:
      description: |-
        Catatan waktu milik user lain dibalas 404, bukan 403 — 403 akan memberi tahu
        bahwa id itu ada, cukup untuk memetakan catatan waktu siapa saja dengan
        mencoba angka satu per satu.
      parameters:
      - description: ID catatan waktu
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TimeEntryEnvelope'
        "400":
          description: id bukan angka positif
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "401":
          description: token tidak dikirim atau tidak valid
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "404":
          description: catatan waktu tidak ditemukan
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Detail catatan waktu
      tags:
      - Time Tracking
    put:
      consumes:
      - application/json
      description: |-
        Update sebagian field. Dipakai terutama untuk membetulkan durasi saat lupa
        menekan Stop: kirim `ended_at` dengan waktu yang semestinya.
        Field yang tidak dikirim tetap memakai nilai lama. Mengirim `ended_at` pada
        entry yang masih berjalan berarti menutupnya; sebaliknya entry yang sudah
        ditutup tidak bisa dijalankan kembali lewat endpoint ini.
      parameters:
      - description: ID catatan waktu
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: Field yang mau diubah saja
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateTimeEntryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TimeEntryEnvelope'
        "400":
          description: validasi gagal, id tidak valid, atau rentang waktu terbalik
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "401":
          description: token tidak dikirim atau tidak valid
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "404":
          description: catatan waktu atau task tidak ditemukan
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Koreksi catatan waktu
      tags:
      - Time Tracking
  /api/v1/time-entries/running:
    get:
      description: |-
        Dipakai saat halaman dimuat, supaya timer yang sedang berjalan tidak hilang
        setelah browser di-refresh.
        Tidak ada timer yang berjalan BUKAN error: dibalas 200 dengan `data` null,
        karena itu keadaan normal yang akan sering terjadi.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.RunningTimeEntryEnvelope'
        "401":
          description: token tidak dikirim atau tidak valid
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Timer yang sedang berjalan
      tags:
      - Time Tracking
  /api/v1/time-entries/start:
    post:
      consumes:
      - application/json
      description: |-
        Memulai pencatatan waktu untuk sebuah task. Waktu mulai diambil dari jam server
        dan pemiliknya dari token — keduanya tidak bisa dikirim dari request.
        Hanya boleh ada satu timer berjalan per user. Kalau masih ada yang berjalan,
        request ini dibalas 409 dan timer lama TIDAK ikut dihentikan.
      parameters:
      - description: Task yang dikerjakan
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.StartTimerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.TimeEntryEnvelope'
        "400":
          description: validasi gagal
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "401":
          description: token tidak dikirim atau tidak valid
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "404":
          description: task tidak ditemukan
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "409":
          description: masih ada timer yang berjalan
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Mulai timer
      tags:
      - Time Tracking
  /api/v1/time-entries/stop:
    post:
      consumes:
      - application/json
      description: |-
        Menutup timer milik pemanggil. Tidak perlu mengirim id entry: hanya ada satu
        timer yang mungkin berjalan per user, jadi tidak ada yang ambigu — sekaligus
        berarti timer milik orang lain tidak bisa dihentikan lewat endpoint ini.
        `note` opsional: kalau tidak dikirim, catatan dari saat Start dipertahankan.
      parameters:
      - description: Catatan penutup (opsional)
        in: body
        name: request
        schema:
          $ref: '#/definitions/dto.StopTimerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TimeEntryEnvelope'
        "400":
          description: validasi gagal
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "401":
          description: token tidak dikirim atau tidak valid
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "409":
          description: tidak ada timer yang sedang berjalan
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Hentikan timer
      tags:
      - Time Tracking
  /api/v1/users:
    get:
      description: '`search` dicocokkan ke `name` dan `job` (case-insensitive, pakai
        ILIKE).'
      parameters:
      - description: Kata kunci pencarian
        in: query
        name: search
        type: string
      - default: 1
        description: Halaman, mulai dari 1
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 10
        description: Jumlah data per halaman
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserListEnvelope'
        "401":
          description: token tidak dikirim atau tidak valid
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "403":
          description: butuh hak admin
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Daftar user
      tags:
      - Users
    post:
      consumes:
      - application/json
      description: |-
        Semua field wajib diisi. `email` harus unik (dibandingkan tanpa membedakan huruf besar/kecil)
        dan `password` minimal 8 karakter, maksimal 72.
        Password disimpan sebagai hash bcrypt dan tidak pernah ikut dikembalikan di response.
      parameters:
      - description: Data user
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.UserEnvelope'
        "400":
          description: validasi gagal
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "401":
          description: token tidak dikirim atau tidak valid
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "403":
          description: butuh hak admin
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "409":
          description: email sudah dipakai user lain
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Buat user baru
      tags:
      - Users
  /api/v1/users/{id}:
    delete:
      description: 'Soft delete: baris hanya diberi `deleted_at`, tidak benar-benar
