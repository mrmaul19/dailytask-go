# Opsional: dipakai kalau belum punya PostgreSQL sendiri.
# Kalau port 5432 sudah dipakai instance lain, cukup set DB_PORT=5433 di .env
# lalu `docker compose up -d` — aplikasi dan container ikut port yang sama.
services:
  postgres:
    image: postgres:17-alpine
    container_name: daily-task-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-daily_task}
      TZ: ${DB_TIMEZONE:-Asia/Jakarta}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-daily_task}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
